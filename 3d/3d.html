<!DOCTYPE html>
<html lang="en">
<head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <link rel="stylesheet" href="3dmodel.css">
    <title>Document</title>
</head>

<body>
    <section>
        <h1>Archery</h1>
    </section>
<div class="scene-wrapper">
    <div class="blured-bg"></div>
     <model-viewer src="arrowanimation.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1" autoplay>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  
    <script src="script1.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
</body>
</html>
