<!DOCTYPE html>
<html lang="en">
<head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <link rel="stylesheet" href="3dmodel.css">
    <title>Document</title>
</head>

<body>
    <section>
        <h1>Archery</h1>
    </section>

     <model-viewer id="viewer" src="arrowanimation.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1">
        <div class="progress-bar hide" slot="progress-bar">
            <div class="update-bar"></div>
        </div>
        <button slot="ar-button" id="ar-button">
            View in your space
        </button>
        <div id="ar-prompt">
            <img src="ar_hand_prompt.png">
        </div>
    </model-viewer>

    <script src="script1.js"></script>

    <audio id="drawSound" src="./draw.mp3" preload="auto"></audio>
    <audio id="hitSound" src="./hit.mp3" preload="auto"></audio>

    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

</body>
</html>
