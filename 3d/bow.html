<!DOCTYPE html>
<html lang="en">
<head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <link rel="stylesheet" href="bow.css">
    <title>Document</title>
</head>
<body>
 
    <section>
        <h1>My Bow</h1>
    </section>

     
<div class="scene-wrapper">
    <div class="blured-bg"></div>
   <model-viewer src="vals_bow.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1">
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      
      <div class="info">
        <h2>This is my bow</h2>
        <ul>
          <li>Material: Aluminum and Fiberglass</li>
          <li>Draw Weight: 33 pounds</li>
          <li>Distance: 70m</li>
          <li>Use: Target Shooting</li>
          <li>Color: Black and Red</li>
          <li>Accessories: Arrow Rest, Stabilizer, Sight</li>
        </ul>
      </div>
    </div>


      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  


    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

</body>
</html>
